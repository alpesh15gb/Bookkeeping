# Host-level nginx for api.apexbooks.in + apexbooks.in + app.apexbooks.in
# Place this at /etc/nginx/sites-available/apexbooks.in (or in /etc/nginx/nginx.conf)

upstream backend_upstream {
    server 127.0.0.1:8000;
}

upstream frontend_upstream {
    server 127.0.0.1:8080;
}

# CORS helper — used for all API locations
# Handles OPTIONS preflight directly in nginx so it never reaches FastAPI
map $http_origin $cors_origin {
    default "";
    "https://app.apexbooks.in" $http_origin;
    "https://apexbooks.in" $http_origin;
    "http://localhost:5173" $http_origin;
    "http://localhost:3000" $http_origin;
}

server {
    listen 80;
    listen 443 ssl http2;
    server_name api.apexbooks.in;

    ssl_certificate /etc/letsencrypt/live/apexbooks.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apexbooks.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers EECDH+AESGCM:EDH+AESGCM;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    client_max_body_size 50M;

    # Handle CORS preflight OPTIONS directly in nginx
    # This ensures OPTIONS never fails before reaching FastAPI
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Tenant-ID, Accept, Idempotency-Key' always;
        add_header 'Access-Control-Max-Age' 1728000 always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Content-Type' 'text/plain; charset=utf-8';
        add_header 'Content-Length' 0;
        return 204;
    }

    location / {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-ID $http_x_tenant_id;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;

        # CORS headers on non-preflight responses
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Tenant-ID, Accept, Idempotency-Key' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
    }

    location /health {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        access_log off;
    }
}

server {
    listen 80;
    listen 443 ssl http2;
    server_name apexbooks.in app.apexbooks.in;

    ssl_certificate /etc/letsencrypt/live/apexbooks.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apexbooks.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers EECDH+AESGCM:EDH+AESGCM;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
