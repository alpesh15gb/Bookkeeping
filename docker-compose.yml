services:
  db:
    image: postgres:16-alpine
    container_name: bookkeeping_db
    restart: always
    environment:
      POSTGRES_DB: bookkeeping
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookkeeping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bookkeeping_net

  redis:
    image: redis:7-alpine
    container_name: bookkeeping_redis
    restart: always
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bookkeeping_net

  backend:
    build: ./backend
    container_name: bookkeeping_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:?DB_PASSWORD must be set}@db:5432/bookkeeping
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY
      - SECRET_KEY
      - ALLOWED_ORIGINS=https://apexbooks.in,https://api.apexbooks.in,https://app.apexbooks.in,tauri://localhost,https://tauri.localhost,tauri://com.apexbooks.desktop
      - CARTUNEZ_MEDUSA_BASE_URL
      - CARTUNEZ_MEDUSA_API_KEY
      - CARTUNEZ_OUTBOUND_ENABLED=${CARTUNEZ_OUTBOUND_ENABLED:-false}
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn src.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bookkeeping_net

  worker:
    build: ./backend
    container_name: bookkeeping_worker
    restart: always
    command: celery -A src.workers.tasks worker --loglevel=info
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:?DB_PASSWORD must be set}@db:5432/bookkeeping
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY
      - SECRET_KEY
      - CARTUNEZ_MEDUSA_BASE_URL
      - CARTUNEZ_MEDUSA_API_KEY
      - CARTUNEZ_OUTBOUND_ENABLED=${CARTUNEZ_OUTBOUND_ENABLED:-false}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - bookkeeping_net

  beat:
    build: ./backend
    container_name: bookkeeping_beat
    restart: always
    command: celery -A src.workers.tasks beat --loglevel=info
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:?DB_PASSWORD must be set}@db:5432/bookkeeping
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY
      - SECRET_KEY
      - CARTUNEZ_MEDUSA_BASE_URL
      - CARTUNEZ_MEDUSA_API_KEY
      - CARTUNEZ_OUTBOUND_ENABLED=${CARTUNEZ_OUTBOUND_ENABLED:-false}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - bookkeeping_net

networks:
  bookkeeping_net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
