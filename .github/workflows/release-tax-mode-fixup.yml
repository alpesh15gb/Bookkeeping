name: Apply backend GST release fixup

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/tax-mode-consistency'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply guarded backend fixup
        shell: bash
        run: |
          if test -f backend/alembic/versions/20260821_0001_recurring_invoice_tax_mode.py \
             && grep -q "is_gst_inclusive=bool(original.is_gst_inclusive)" backend/src/api/v1/invoices.py; then
            echo "Backend release fixup already applied."
            exit 0
          fi
          python backend/scripts/release_tax_mode_fixup.py
          python -m compileall -q backend/src backend/scripts

      - name: Commit backend source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            backend/src/infrastructure/database/models.py \
            backend/src/schemas/document.py \
            backend/src/api/v1/recurring_invoices.py \
            backend/src/api/v1/invoices.py \
            backend/src/api/v1/bills.py \
            backend/src/domains/printing/invoice_pdf.py \
            backend/src/main.py \
            backend/alembic/versions/20260821_0001_recurring_invoice_tax_mode.py \
            backend/tests/test_tax_mode_contract.py
          if git diff --cached --quiet; then
            echo "No backend release fixup changes to commit."
            exit 0
          fi
          git commit -m "fix: preserve GST rate semantics across backend flows"
          git push origin HEAD:fix/tax-mode-consistency
