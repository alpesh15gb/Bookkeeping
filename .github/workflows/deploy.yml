name: CI/CD Pipeline

on:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-xdist Faker freezegun mock anyio pytest-asyncio "httpx<0.27.0"
          pip show httpx

      - name: Create Dummy Env File
        run: |
          echo "JWT_SECRET_KEY=test-jwt-secret-key-for-testing-purposes-only-32chars" > backend/.env
          echo "SECRET_KEY=test-secret-key-for-testing-purposes-only" >> backend/.env

      - name: Run Backend Tests
        run: |
          cd backend
          PYTHONPATH=. python -m pytest -n0 --tb=short

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Flutter Web
        run: |
          cd frontend
          flutter pub get
          flutter build web --release --tree-shake-icons

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            cd /opt/bookkeeping
            git pull origin master

            # Build and restart all services including frontend
            docker compose up -d --build

            sleep 10

            # Run database migrations
            docker compose exec -T backend alembic upgrade head

            # Restart nginx to pick up config changes
            sudo cp /opt/bookkeeping/nginx.conf /etc/nginx/sites-available/apexbooks.in
            sudo nginx -t && sudo systemctl reload nginx

            # Verify all services are running
            docker compose ps
