components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
    HmacSignature:
      type: apiKey
      in: header
      name: X-Signature
  parameters:
    ApiKey:
      name: X-Api-Key
      in: header
      required: true
      schema: {type: string, minLength: 32, maxLength: 256}
      example: ctz_live_7f91f651f6f64564a588a347a7f56c8e
    TenantId:
      name: X-Tenant-Id
      in: header
      required: true
      schema: {$ref: '#/components/schemas/TenantId'}
      example: tenant_cartunez_in
    EventId:
      name: X-Event-Id
      in: header
      required: true
      schema: {$ref: '#/components/schemas/EventId'}
      example: evt_01J2Y8N4E6W7P3M9T5K1Q0R2S4
    IdempotencyKey:
      name: X-Idempotency-Key
      in: header
      required: true
      schema: {$ref: '#/components/schemas/IdempotencyKey'}
      example: tenant_cartunez_in:order.created:order_01J2Y8MZ4R3E2S1T0V9W8X7Y6Z:v1
    Timestamp:
      name: X-Timestamp
      in: header
      required: true
      schema: {$ref: '#/components/schemas/UtcTimestamp'}
      example: '2026-07-17T10:00:00Z'
    Signature:
      name: X-Signature
      in: header
      required: true
      schema:
        type: string
        pattern: '^sha256=[a-f0-9]{64}$'
      example: sha256=4c68d6df7f87742e62f2cae2f91ef269900c093dfde406422673ea2c83c1a7a9
    ExternalOrderId:
      name: external_order_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/MedusaOrderId'}
    ApexBooksProductId:
      name: apexbooks_product_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ApexBooksId'}
    ApexBooksCustomerId:
      name: apexbooks_customer_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ApexBooksId'}
  schemas:
    TenantId:
      type: string
      pattern: '^[a-z][a-z0-9_]{2,63}$'
    EventId:
      type: string
      pattern: '^evt_[A-Z0-9]{26}$'
    IdempotencyKey:
      type: string
      minLength: 15
      maxLength: 255
      pattern: '^[a-z][a-z0-9_]{2,63}:[a-z]+\.[a-z]+:[A-Za-z0-9_-]+:v1$'
    UtcTimestamp:
      type: string
      format: date-time
      pattern: 'Z$'
    MedusaOrderId:
      type: string
      pattern: '^order_[A-Z0-9]{26}$'
    ApexBooksId:
      type: string
      pattern: '^ab_[a-z]+_[A-Z0-9]{26}$'
    Money:
      type: object
      additionalProperties: false
      required: [currency_code, amount_minor]
      properties:
        currency_code:
          type: string
          pattern: '^[A-Z]{3}$'
        amount_minor:
          type: integer
          minimum: 0
    Address:
      type: object
      additionalProperties: false
      required: [name, address_1, city, state, state_code, postal_code, country_code]
      properties:
        name: {type: string, minLength: 1, maxLength: 150}
        company: {type: [string, 'null'], maxLength: 150}
        phone: {type: [string, 'null'], pattern: '^\+[1-9][0-9]{7,14}$'}
        address_1: {type: string, minLength: 1, maxLength: 200}
        address_2: {type: [string, 'null'], maxLength: 200}
        city: {type: string, minLength: 1, maxLength: 100}
        state: {type: string, minLength: 1, maxLength: 100}
        state_code: {type: string, pattern: '^[0-9]{2}$'}
        postal_code: {type: string, pattern: '^[0-9]{6}$'}
        country_code: {type: string, const: IN}
    GstIdentity:
      type: object
      additionalProperties: false
      required: [gstin, gst_type, state_code]
      properties:
        gstin:
          type: [string, 'null']
          pattern: '^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$'
        gst_type:
          type: string
          enum: [CONSUMER, UNREGISTERED, REGULAR, COMPOSITION, SEZ, OVERSEAS]
        state_code: {type: string, pattern: '^[0-9]{2}$'}
      allOf:
        - if:
            properties: {gst_type: {enum: [REGULAR, COMPOSITION, SEZ]}}
          then:
            properties: {gstin: {type: string}}
        - if:
            properties: {gst_type: {enum: [CONSUMER, UNREGISTERED, OVERSEAS]}}
          then:
            properties: {gstin: {type: 'null'}}
    CustomerInput:
      type: object
      additionalProperties: false
      required:
        - medusa_customer_id
        - accounting_email
        - first_name
        - last_name
        - phone
        - gst
        - billing_address
        - shipping_address
        - credit_terms_days
      properties:
        medusa_customer_id: {type: string, pattern: '^cus_[A-Z0-9]{26}$'}
        apexbooks_customer_id:
          oneOf:
            - {$ref: '#/components/schemas/ApexBooksId'}
            - {type: 'null'}
        accounting_email: {type: string, format: email, maxLength: 255}
        first_name: {type: string, minLength: 1, maxLength: 75}
        last_name: {type: string, minLength: 1, maxLength: 75}
        phone: {type: string, pattern: '^\+[1-9][0-9]{7,14}$'}
        gst: {$ref: '#/components/schemas/GstIdentity'}
        billing_address: {$ref: '#/components/schemas/Address'}
        shipping_address: {$ref: '#/components/schemas/Address'}
        credit_terms_days: {type: integer, minimum: 0, maximum: 365}
    CanonicalCustomer:
      type: object
      additionalProperties: false
      required:
        - apexbooks_customer_id
        - medusa_customer_id
        - accounting_email
        - first_name
        - last_name
        - phone
        - gst
        - billing_address
        - shipping_address
        - credit_terms_days
        - active
        - updated_at
      properties:
        apexbooks_customer_id: {$ref: '#/components/schemas/ApexBooksId'}
        medusa_customer_id: {type: string, pattern: '^cus_[A-Z0-9]{26}$'}
        accounting_email: {type: string, format: email, maxLength: 255}
        first_name: {type: string, minLength: 1, maxLength: 75}
        last_name: {type: string, minLength: 1, maxLength: 75}
        phone: {type: string, pattern: '^\+[1-9][0-9]{7,14}$'}
        gst: {$ref: '#/components/schemas/GstIdentity'}
        billing_address: {$ref: '#/components/schemas/Address'}
        shipping_address: {$ref: '#/components/schemas/Address'}
        credit_terms_days: {type: integer, minimum: 0, maximum: 365}
        active: {type: boolean}
        updated_at: {$ref: '#/components/schemas/UtcTimestamp'}
    GstBreakdown:
      type: object
      additionalProperties: false
      required:
        - hsn_sac
        - gst_rate_bps
        - taxable_value_minor
        - discount_minor
        - cgst_rate_bps
        - cgst_amount_minor
        - sgst_rate_bps
        - sgst_amount_minor
        - igst_rate_bps
        - igst_amount_minor
        - cess_rate_bps
        - cess_amount_minor
        - tax_amount_minor
      properties:
        hsn_sac: {type: string, pattern: '^[0-9]{4,8}$'}
        gst_rate_bps: {type: integer, minimum: 0, maximum: 10000}
        taxable_value_minor: {type: integer, minimum: 0}
        discount_minor: {type: integer, minimum: 0}
        cgst_rate_bps: {type: integer, minimum: 0, maximum: 10000}
        cgst_amount_minor: {type: integer, minimum: 0}
        sgst_rate_bps: {type: integer, minimum: 0, maximum: 10000}
        sgst_amount_minor: {type: integer, minimum: 0}
        igst_rate_bps: {type: integer, minimum: 0, maximum: 10000}
        igst_amount_minor: {type: integer, minimum: 0}
        cess_rate_bps: {type: integer, minimum: 0, maximum: 10000}
        cess_amount_minor: {type: integer, minimum: 0}
        tax_amount_minor: {type: integer, minimum: 0}
    OrderLine:
      type: object
      additionalProperties: false
      required:
        - medusa_line_id
        - medusa_product_id
        - medusa_variant_id
        - apexbooks_product_id
        - apexbooks_variant_id
        - sku
        - title
        - product_type
        - quantity
        - unit_price
        - tax_inclusive
        - discount
        - gst
        - line_total
      properties:
        medusa_line_id: {type: string, pattern: '^item_[A-Z0-9]{26}$'}
        medusa_product_id: {type: string, pattern: '^prod_[A-Z0-9]{26}$'}
        medusa_variant_id: {type: string, pattern: '^variant_[A-Z0-9]{26}$'}
        apexbooks_product_id: {$ref: '#/components/schemas/ApexBooksId'}
        apexbooks_variant_id: {$ref: '#/components/schemas/ApexBooksId'}
        sku: {type: string, minLength: 1, maxLength: 64}
        title: {type: string, minLength: 1, maxLength: 200}
        product_type: {type: string, enum: [GOODS, SERVICE]}
        quantity: {type: integer, minimum: 1, maximum: 1000000}
        unit_price: {$ref: '#/components/schemas/Money'}
        tax_inclusive: {type: boolean}
        discount: {$ref: '#/components/schemas/Money'}
        gst: {$ref: '#/components/schemas/GstBreakdown'}
        line_total: {$ref: '#/components/schemas/Money'}
    ShippingCharge:
      type: object
      additionalProperties: false
      required: [title, unit_price, tax_inclusive, discount, gst, line_total]
      properties:
        title: {type: string, const: Shipping}
        unit_price: {$ref: '#/components/schemas/Money'}
        tax_inclusive: {type: boolean}
        discount: {$ref: '#/components/schemas/Money'}
        gst: {$ref: '#/components/schemas/GstBreakdown'}
        line_total: {$ref: '#/components/schemas/Money'}
    OrderTotals:
      type: object
      additionalProperties: false
      required: [items_gross, discount_total, taxable_total, tax_total, shipping_total, grand_total]
      properties:
        items_gross: {$ref: '#/components/schemas/Money'}
        discount_total: {$ref: '#/components/schemas/Money'}
        taxable_total: {$ref: '#/components/schemas/Money'}
        tax_total: {$ref: '#/components/schemas/Money'}
        shipping_total: {$ref: '#/components/schemas/Money'}
        grand_total: {$ref: '#/components/schemas/Money'}
    OrderSnapshot:
      type: object
      additionalProperties: false
      required:
        - medusa_order_id
        - display_id
        - order_revision
        - currency_code
        - seller_state_code
        - place_of_supply_state_code
        - customer
        - billing_address
        - shipping_address
        - lines
        - shipping
        - totals
        - placed_at
      properties:
        medusa_order_id: {$ref: '#/components/schemas/MedusaOrderId'}
        display_id: {type: integer, minimum: 1}
        order_revision: {type: integer, minimum: 1}
        currency_code: {type: string, pattern: '^[A-Z]{3}$'}
        seller_state_code: {type: string, pattern: '^[0-9]{2}$'}
        place_of_supply_state_code: {type: string, pattern: '^[0-9]{2}$'}
        customer: {$ref: '#/components/schemas/CustomerInput'}
        billing_address: {$ref: '#/components/schemas/Address'}
        shipping_address: {$ref: '#/components/schemas/Address'}
        lines:
          type: array
          minItems: 1
          maxItems: 1000
          items: {$ref: '#/components/schemas/OrderLine'}
        shipping: {$ref: '#/components/schemas/ShippingCharge'}
        totals: {$ref: '#/components/schemas/OrderTotals'}
        customer_reference: {type: [string, 'null'], maxLength: 100}
        notes: {type: [string, 'null'], maxLength: 2000}
        placed_at: {$ref: '#/components/schemas/UtcTimestamp'}
    EventEnvelope:
      type: object
      required:
        - event_id
        - event_name
        - event_version
        - tenant_id
        - occurred_at
        - source_system
        - source_id
        - idempotency_key
      properties:
        event_id: {$ref: '#/components/schemas/EventId'}
        event_name: {type: string}
        event_version: {type: string, const: v1}
        tenant_id: {$ref: '#/components/schemas/TenantId'}
        occurred_at: {$ref: '#/components/schemas/UtcTimestamp'}
        source_system: {type: string, enum: [MEDUSA, APEXBOOKS]}
        source_id: {type: string, pattern: '^[A-Za-z][A-Za-z0-9_-]{2,100}$'}
        idempotency_key: {$ref: '#/components/schemas/IdempotencyKey'}
    OrderCreatedRequest:
      allOf:
        - {$ref: '#/components/schemas/EventEnvelope'}
        - type: object
          required: [event_name, order]
          properties:
            event_name: {const: order.created}
            source_system: {const: MEDUSA}
            order: {$ref: '#/components/schemas/OrderSnapshot'}
      unevaluatedProperties: false
    OrderUpdatedRequest:
      allOf:
        - {$ref: '#/components/schemas/EventEnvelope'}
        - type: object
          required: [event_name, expected_order_revision, order]
          properties:
            event_name: {const: order.updated}
            source_system: {const: MEDUSA}
            expected_order_revision: {type: integer, minimum: 1}
            order: {$ref: '#/components/schemas/OrderSnapshot'}
      unevaluatedProperties: false
    OrderCancellation:
      type: object
      additionalProperties: false
      required: [medusa_order_id, expected_order_revision, reason_code, reason, cancelled_at]
      properties:
        medusa_order_id: {$ref: '#/components/schemas/MedusaOrderId'}
        expected_order_revision: {type: integer, minimum: 1}
        reason_code: {type: string, enum: [CUSTOMER_REQUEST, PAYMENT_FAILED, FRAUD, INVENTORY_UNAVAILABLE, DUPLICATE_ORDER, OTHER]}
        reason: {type: string, minLength: 3, maxLength: 500}
        cancelled_at: {$ref: '#/components/schemas/UtcTimestamp'}
    OrderCancelledRequest:
      allOf:
        - {$ref: '#/components/schemas/EventEnvelope'}
        - type: object
          required: [event_name, cancellation]
          properties:
            event_name: {const: order.cancelled}
            source_system: {const: MEDUSA}
            cancellation: {$ref: '#/components/schemas/OrderCancellation'}
      unevaluatedProperties: false
    PaymentCapture:
      type: object
      additionalProperties: false
      required:
        - medusa_payment_id
        - medusa_order_id
        - capture_sequence
        - amount
        - provider_id
        - transaction_id
        - captured_at
      properties:
        medusa_payment_id: {type: string, pattern: '^pay_[A-Z0-9]{26}$'}
        medusa_order_id: {$ref: '#/components/schemas/MedusaOrderId'}
        capture_sequence: {type: integer, minimum: 1}
        amount: {$ref: '#/components/schemas/Money'}
        provider_id: {type: string, minLength: 1, maxLength: 100}
        transaction_id: {type: string, minLength: 1, maxLength: 150}
        captured_at: {$ref: '#/components/schemas/UtcTimestamp'}
    PaymentCapturedRequest:
      allOf:
        - {$ref: '#/components/schemas/EventEnvelope'}
        - type: object
          required: [event_name, payment]
          properties:
            event_name: {const: payment.captured}
            source_system: {const: MEDUSA}
            payment: {$ref: '#/components/schemas/PaymentCapture'}
      unevaluatedProperties: false
    RefundLine:
      type: object
      additionalProperties: false
      required:
        - original_invoice_line_id
        - medusa_line_id
        - apexbooks_product_id
        - apexbooks_variant_id
        - sku
        - product_type
        - quantity
        - unit_price
        - tax_inclusive
        - discount
        - gst
        - refund_total
        - restock
        - related_medusa_return_id
      properties:
        original_invoice_line_id: {$ref: '#/components/schemas/ApexBooksId'}
        medusa_line_id: {type: string, pattern: '^item_[A-Z0-9]{26}$'}
        apexbooks_product_id: {$ref: '#/components/schemas/ApexBooksId'}
        apexbooks_variant_id: {$ref: '#/components/schemas/ApexBooksId'}
        sku: {type: string, minLength: 1, maxLength: 64}
        product_type: {type: string, enum: [GOODS, SERVICE]}
        quantity: {type: integer, minimum: 1}
        unit_price: {$ref: '#/components/schemas/Money'}
        tax_inclusive: {type: boolean}
        discount: {$ref: '#/components/schemas/Money'}
        gst: {$ref: '#/components/schemas/GstBreakdown'}
        refund_total: {$ref: '#/components/schemas/Money'}
        restock: {type: boolean}
        related_medusa_return_id:
          type: [string, 'null']
          pattern: '^ret_[A-Z0-9]{26}$'
    Refund:
      type: object
      additionalProperties: false
      required:
        - medusa_refund_id
        - medusa_payment_id
        - medusa_order_id
        - apexbooks_invoice_id
        - amount
        - provider_refund_id
        - refunded_at
        - reason
        - cancel_order
        - lines
      properties:
