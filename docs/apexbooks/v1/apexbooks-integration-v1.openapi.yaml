openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Cartunez Medusa ↔ ApexBooks Integration Contract
  version: 1.0.0
  summary: Canonical, complete, bidirectional integration contract.
  description: |
    This document is the sole normative contract for Cartunez Medusa and ApexBooks v1.
    ApexBooks owns products, prices, inventory, customer business data, GST, sales
    orders, invoices, receipts, refunds, credit notes, inventory movements, and
    accounting. Medusa owns storefront presentation, authentication credentials,
    carts, checkout, commerce order orchestration, and shipping workflow.

    Both systems communicate only through the HTTPS operations in this document.
    Direct cross-system database access is prohibited. Every request is authenticated,
    signed, tenant-scoped, replay-protected, idempotent, and JSON Schema validated.

    Normative lifecycle policy:

    1. `order.created` creates a DRAFT ApexBooks sales order and reserves stock. It
       never creates an invoice.
    2. `order.updated` replaces the complete commercial snapshot only while the sales
       order is DRAFT and has no captured payment or invoice. It updates reservations
       by the quantity delta. Otherwise it fails with `ORDER_IMMUTABLE`.
    3. The first `payment.captured` creates and posts one invoice for the full order,
       converts all reservations to stock-out movements, and creates a receipt for the
       captured amount. Later captures create receipts against the same invoice. Total
       captures cannot exceed the invoice total.
    4. An unpaid, uninvoiced cancellation cancels the sales order and releases all
       reservations. A paid or invoiced cancellation fails with `REFUND_REQUIRED`.
       The caller must complete the external refund and send `payment.refunded` with
       `cancel_order: true`; successful refund processing then cancels the order when
       captured minus refunded equals zero.
    5. `return.created` records a goods return only. It never creates a credit note or
       cash refund. A line with `restock: true` requires `received_at` and creates one
       RETURN_IN movement immediately. A line with `restock: false` creates no stock
       movement.
    6. `payment.refunded` creates one credit note and one refund disbursement. A refund
       linked to a return that already restocked must set `restock: false`. A standalone
       refund is permitted to set `restock: true`, creating RETURN_IN exactly once.
    7. Duplicate delivery of the same event ID, idempotency key, and body returns the
       byte-equivalent original success response with HTTP 200 and
       `Idempotency-Replayed: true`. Reuse of either identifier with a different body,
       event name, source ID, or counterpart identifier returns HTTP 409.

    All money is integer ISO-4217 minor units. Major-unit money is prohibited.
    GST rates are integer basis points: 1800 means 18.00 percent.
servers:
  - url: https://api.apexbooks.in
    description: ApexBooks production API origin.
tags:
  - name: ApexBooks Receiver
    description: Medusa-to-ApexBooks commerce imports.
  - name: Medusa Receiver
    description: ApexBooks-to-Medusa authoritative master-data synchronization.
security:
  - ApiKeyAuth: []
    HmacSignature: []
x-identifier-mapping:
  retention: permanent
  apexbooks_required_columns:
    - tenant_id
    - entity_type
    - medusa_id
    - apexbooks_id
    - created_at
    - updated_at
  unique_constraints:
    - [tenant_id, entity_type, medusa_id]
    - [tenant_id, entity_type, apexbooks_id]
x-authentication:
  transport: HTTPS with TLS 1.2 or newer
  api_key: X-Api-Key identifies one enabled integration client and its allowed tenant IDs.
  tenant_secret: Each tenant has a distinct 256-bit or stronger HMAC secret.
  canonical_signature_input: "{X-Timestamp}.{UPPERCASE_METHOD}.{raw_path}.{raw_body_bytes}"
  timestamp: RFC 3339 UTC with Z suffix; fractional seconds are permitted.
  maximum_clock_skew_seconds: 300
  comparison: Decode the 64 lowercase hexadecimal signature and compare in constant time.
  body: The exact received UTF-8 bytes are signed before JSON parsing or normalization.
x-idempotency:
  key_format: "{tenant_id}:{event_name}:{source_id}:{event_version}"
  event_version: v1
  retention_days: 30
  request_hash: SHA-256 of raw request body bytes
  response_hash: SHA-256 of raw response body bytes
  exact_replay: Event ID, idempotency key, tenant, event name, source ID, method, path, and request hash all match the stored record; return the stored status body as HTTP 200 with Idempotency-Replayed true.
  conflict: If either event ID or idempotency key already exists but any other stored identity or request hash differs, return HTTP 409 with REPLAY_DETECTED for event-ID reuse or IDEMPOTENCY_CONFLICT for key reuse.
  persisted_fields:
    - event_id
    - idempotency_key
    - tenant_id
    - event_name
    - source_id
    - signature_hash
    - request_hash
    - response_hash
    - response_status
    - response_body
    - processed_at
    - status
x-retry-policy:
  retryable_http_statuses: [408, 429, 500, 502, 503, 504]
  retryable_transport_failures: [connection_timeout, read_timeout, connection_reset, dns_temporary_failure]
  non_retryable_http_statuses: [200, 201, 400, 401, 403, 404, 409, 422]
  schedule_seconds: [60, 300, 900, 3600, 21600, 86400]
  maximum_window_seconds: 259200
  after_schedule: After using each listed delay once, repeat the final 86400-second delay while the next attempt remains inside the 259200-second window.
  rule: The sender repeats the identical method, path, headers, and raw body until success or the maximum window; after the final failure it writes a dead-letter record and alerts operations.
x-multi-tenant-resolution:
  receiver: X-Tenant-Id is authoritative and must equal body tenant_id. The API key must be enabled for exactly that tenant or for an explicit allow-list containing it. The tenant must exist and have an enabled integration secret.
  medusa_sender_order: Resolve metadata.apexbooks.tenant_id from store, then sales channel, then region, then the configured APEXBOOKS_DEFAULT_TENANT_ID. The first non-empty value wins.
  prohibited_inference: Tenant identity is never inferred from email, domain, country, address, SKU, handle, or product metadata other than metadata.apexbooks.tenant_id.
  unresolved_behavior: Do not send the HTTP request; persist a failed outbound event with TENANT_NOT_RESOLVED and alert operations.
x-ownership:
  customer: ApexBooks owns names, accounting email, phone, GST identity, addresses, state code, credit terms, active status, and ledger identity. Medusa owns authentication credentials and must not overwrite synchronized business fields after mapping.
  product: ApexBooks owns title, description, HSN/SAC, GST rate, active status, categories, images, variants, SKUs, and product type. Medusa owns only metadata.medusa.seo_title, metadata.medusa.seo_description, metadata.medusa.search_keywords, and metadata.medusa.merchandising_rank; product.changed leaves those four fields unchanged.
  price: ApexBooks owns every active price. A price.updated event with replace_all true atomically removes prior active prices for the product and installs the supplied set.
  inventory: ApexBooks owns available and reserved quantities per variant and warehouse. An inventory.updated event with replace_all true atomically replaces every prior level for the product.
  order_validation: ApexBooks validates each mapped product/variant, exact SKU, active price at placed_at, tax_inclusive flag, GST rate, HSN/SAC, arithmetic, and available unreserved stock before creating the order.
x-customer-upsert:
  match_order:
    - apexbooks_customer_id when non-null and mapped to the same Medusa customer
    - existing tenant mapping by medusa_customer_id
    - exact normalized GSTIN for REGULAR, COMPOSITION, or SEZ customers
    - exact case-insensitive accounting_email for customers without GSTIN
  collision: If candidates identify different ApexBooks customers, reject with LIFECYCLE_CONFLICT and create nothing.
  canonicalization: Trim surrounding text whitespace; lowercase accounting email; uppercase GSTIN; preserve phone in E.164; never merge across tenants.
x-audit-logging:
  retention_days: 2555
  atomic: Audit records are committed in the same transaction as the business change.
  required_fields: [request_id, event_id, idempotency_key, tenant_id, direction, method, path, api_client_id, signature_hash, request_hash, response_hash, response_status, event_name, source_id, entity_mappings, started_at, processed_at, outcome, retry_count]
  pii_policy: Store encrypted request and response bodies; mask API keys, signatures, GSTIN characters 3 through 12, phone digits except the last four, and accounting-email local parts in searchable logs.
  immutability: Audit records are append-only; corrections create linked amendment records.
x-header-body-consistency:
  X-Tenant-Id: Must equal body tenant_id.
  X-Event-Id: Must equal body event_id.
  X-Idempotency-Key: Must equal body idempotency_key and the canonical key formula.
  path_identifier: Must equal the matching identifier inside the body and body source_id for operations with a path identifier.
  mismatch_result: Return HTTP 400 with VALIDATION_ERROR before business processing.
x-lifecycle-rules:
  order_created:
    prerequisites: Customer upsert succeeds; every product and variant mapping is active; SKU, price effective at placed_at, tax mode, HSN/SAC, GST rate, arithmetic, currency, and available unreserved stock match ApexBooks.
    result: Create one DRAFT sales order, line mappings, and reservations. Return no invoice ID.
  order_updated:
    prerequisites: Path ID, source ID, and snapshot order ID match; stored status is DRAFT; no invoice or capture exists; expected_order_revision equals stored revision; new revision equals expected revision plus one.
    result: Atomically replace the complete snapshot and apply reservation deltas.
  order_cancelled:
    unpaid_result: Cancel DRAFT order and release all reservations.
    paid_or_invoiced_result: Make no change and return HTTP 409 REFUND_REQUIRED.
  payment_captured:
    prerequisites: Payment maps to the order; capture sequence is new and exactly one greater than the greatest prior sequence; currency equals order currency; cumulative captured amount does not exceed order grand total.
    first_capture: Create and post one invoice for the complete order, convert reservations to SALE_OUT, create the receipt, and allocate the captured amount.
    later_capture: Reuse the invoice, create one receipt, and allocate the captured amount.
    status: PARTIALLY_PAID until cumulative captures equal invoice total, then PAID.
  return_created:
    prerequisites: Invoice and line mappings exist; cumulative returned quantity per invoice line including this request does not exceed invoiced quantity; service lines cannot restock.
    result: Create one goods return. A restock-true line creates RETURN_IN once and requires received_at. A restock-false line creates no movement.
    status: RECEIVED when every line has restock true and received_at; PARTIALLY_RECEIVED when at least one but not every line is received; AUTHORIZED when no line is received.
  payment_refunded:
    prerequisites: Original payment, order, invoice, and lines map consistently; cumulative refund amount does not exceed cumulative captures; cumulative credited quantity does not exceed invoiced quantity; refund amount equals sum of line refund totals.
    result: Create one posted credit note and one refund disbursement. Standalone restock-true goods lines create RETURN_IN. Lines linked to an already restocked return must be restock false.
    cancellation: If cancel_order is true and cumulative refunds equal cumulative captures, set order CANCELLED; otherwise preserve PARTIALLY_PAID or PAID according to remaining net captured amount.
  customer_created:
    result: Apply the deterministic customer upsert rules, create the permanent ID mapping, and return the canonical ApexBooks customer.
  outbound_master_sync:
    result: Product, price, inventory, and customer PUT operations atomically replace the specified authoritative scope and persist all returned Medusa mappings.
x-http-status-map:
  "200": Successful update, cancellation, or exact idempotent replay.
  "201": Newly created resource or newly accepted upsert.
  "400": Malformed JSON, schema failure, header/body mismatch, or unsupported event version.
  "401": Missing or unknown API key.
  "403": Invalid signature, expired timestamp, disabled tenant, or client not authorized for tenant.
  "404": Referenced mapped resource does not exist.
  "409": Identifier reuse conflict, immutable order, refund required, or lifecycle conflict.
  "422": Valid request that violates price, GST, inventory, capture, refund, or return constraints.
  "429": Rate limit exceeded.
  "500": Unhandled receiver failure; no partial business transaction is committed.
  "502": Gateway could not reach the receiver; retryable.
  "503": Receiver dependency unavailable; no partial business transaction is committed.
  "504": Gateway timed out waiting for the receiver; retryable.
  "408": Receiver timed out reading the request; retryable.
x-gst-rules:
  rate_unit: basis points
  rounding: Half up to the nearest minor unit independently for taxable value and each tax component.
  line_formulas:
    gross_amount_minor: unit_price.amount_minor multiplied by quantity
    exclusive_taxable: gross_amount_minor minus discount.amount_minor
    inclusive_discounted_gross: gross_amount_minor minus discount.amount_minor
    component_tax: taxable_value_minor multiplied by component rate basis points divided by 10000, rounded half up
    tax_amount_minor: cgst plus sgst plus igst plus cess amounts
    line_total_minor: taxable_value_minor plus tax_amount_minor
  jurisdiction:
    intrastate: seller_state_code equals place_of_supply_state_code; IGST rate and amount are zero; CGST plus SGST rates equal GST rate.
    interstate: seller_state_code differs from place_of_supply_state_code; CGST and SGST rates and amounts are zero; IGST rate equals GST rate.
  discounts: Order-level discounts are already allocated into each line discount by the sender in proportion to pre-tax line value; shipping discounts appear only on the shipping charge.
  reconciliation: Invoice total equals the sum of rounded item line totals and rounded shipping line total. No separate rounding adjustment is allowed in v1; a payload that does not reconcile exactly is rejected with GST_MISMATCH.
x-accounting-rules:
  invoice_posting:
    debit: Customer accounts receivable for invoice grand total.
    credits: Sales revenue for taxable value, output CGST, output SGST, output IGST, output cess, and shipping revenue/tax according to the shipping breakdown.
  receipt_posting:
    debit: Cash, bank, card clearing, or payment-gateway clearing account selected by provider_id.
    credit: Customer accounts receivable.
  credit_note_posting:
    debits: Sales return revenue and the original output tax accounts.
    credit: Customer accounts receivable.
  refund_disbursement_posting:
    debit: Customer accounts receivable.
    credit: The payment-provider clearing or bank account used by the original receipt.
  atomicity: Each endpoint commits its idempotency row, mappings, audit records, business documents, inventory movements, and journal entries in one database transaction.
x-inventory-rules:
  order_created: Create RESERVATION movements; available quantity is unchanged and reserved quantity increases.
  order_updated: Apply reservation deltas; reject if an increased reservation exceeds available minus reserved.
  payment_first_capture: Release reservations and create SALE_OUT movements; available and on-hand quantities decrease by invoiced goods quantities.
  unpaid_cancellation: Release reservations with RESERVATION_RELEASE movements.
  return_or_refund_restock: Create RETURN_IN only when restock is true and only once for a return/refund linkage.
  services: Product variants marked SERVICE never create inventory movements.
x-sequence-diagrams:
  order_created: |
    sequenceDiagram
      participant M as Medusa
      participant A as ApexBooks
      M->>A: POST /api/integrations/medusa/v1/orders
      A->>A: Validate signature, schema, mappings, price, GST, stock
      A->>A: Create DRAFT sales order and reservations
      A-->>M: 201 sales_order_id and customer_id
  payment_captured: |
    sequenceDiagram
      participant G as Payment Gateway
      participant M as Medusa
      participant A as ApexBooks
      G->>M: Capture confirmed
      M->>A: POST /api/integrations/medusa/v1/payments/captured
      A->>A: Create/post invoice if first capture
      A->>A: Convert reservations to SALE_OUT and post receipt
      A-->>M: 201 payment_id, receipt_id, invoice_id
  return_then_refund: |
    sequenceDiagram
      participant M as Medusa
      participant A as ApexBooks
      M->>A: POST /api/integrations/medusa/v1/returns
      A->>A: Record goods return; restock eligible received lines
      A-->>M: 201 return_id
      M->>A: POST /api/integrations/medusa/v1/payments/refunded
      A->>A: Create credit note and refund disbursement without duplicate restock
      A-->>M: 201 refund_id and credit_note_id
  master_data_sync: |
    sequenceDiagram
      participant A as ApexBooks
      participant M as Medusa
      A->>M: PUT authoritative product, price, inventory, or customer event
      M->>M: Validate, upsert, map IDs, and store event result
      M-->>A: 200 or 201 standard success envelope

paths:
  /api/integrations/medusa/v1/orders:
    post:
      tags: [ApexBooks Receiver]
      operationId: importMedusaOrderCreatedV1
      summary: Create a DRAFT sales order and reserve stock.
      parameters:
        - $ref: '#/components/parameters/ApiKey'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderCreatedRequest'}
            examples:
              consumerOrder:
                $ref: '#/components/examples/OrderCreatedRequestExample'
      responses:
        '200': {$ref: '#/components/responses/OrderSuccessReplay'}
        '201': {$ref: '#/components/responses/OrderCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '408': {$ref: '#/components/responses/RequestTimeout'}
        '500': {$ref: '#/components/responses/InternalError'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '504': {$ref: '#/components/responses/GatewayTimeout'}
  /api/integrations/medusa/v1/orders/{external_order_id}:
    patch:
      tags: [ApexBooks Receiver]
      operationId: importMedusaOrderUpdatedV1
      summary: Replace the complete DRAFT commercial snapshot.
      parameters:
        - $ref: '#/components/parameters/ExternalOrderId'
        - $ref: '#/components/parameters/ApiKey'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderUpdatedRequest'}
            examples:
              revisedOrder:
                $ref: '#/components/examples/OrderUpdatedRequestExample'
      responses:
        '200': {$ref: '#/components/responses/OrderUpdated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '408': {$ref: '#/components/responses/RequestTimeout'}
        '500': {$ref: '#/components/responses/InternalError'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '504': {$ref: '#/components/responses/GatewayTimeout'}
  /api/integrations/medusa/v1/orders/{external_order_id}/cancel:
    post:
      tags: [ApexBooks Receiver]
      operationId: importMedusaOrderCancelledV1
      summary: Cancel an unpaid and uninvoiced order.
      parameters:
        - $ref: '#/components/parameters/ExternalOrderId'
        - $ref: '#/components/parameters/ApiKey'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderCancelledRequest'}
            examples:
              buyerCancellation:
                $ref: '#/components/examples/OrderCancelledRequestExample'
      responses:
        '200': {$ref: '#/components/responses/OrderCancelled'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '408': {$ref: '#/components/responses/RequestTimeout'}
        '500': {$ref: '#/components/responses/InternalError'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '504': {$ref: '#/components/responses/GatewayTimeout'}
  /api/integrations/medusa/v1/payments/captured:
    post:
      tags: [ApexBooks Receiver]
      operationId: importMedusaPaymentCapturedV1
      summary: Create/post the invoice when required and record a receipt.
      parameters:
        - $ref: '#/components/parameters/ApiKey'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PaymentCapturedRequest'}
            examples:
              fullCapture:
                $ref: '#/components/examples/PaymentCapturedRequestExample'
      responses:
        '200': {$ref: '#/components/responses/PaymentSuccessReplay'}
        '201': {$ref: '#/components/responses/PaymentCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '408': {$ref: '#/components/responses/RequestTimeout'}
        '500': {$ref: '#/components/responses/InternalError'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '504': {$ref: '#/components/responses/GatewayTimeout'}
  /api/integrations/medusa/v1/payments/refunded:
    post:
      tags: [ApexBooks Receiver]
      operationId: importMedusaPaymentRefundedV1
      summary: Create a credit note, refund disbursement, and optional one-time restock.
      parameters:
        - $ref: '#/components/parameters/ApiKey'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PaymentRefundedRequest'}
            examples:
              returnedGoodsRefund:
                $ref: '#/components/examples/PaymentRefundedRequestExample'
      responses:
        '200': {$ref: '#/components/responses/RefundSuccessReplay'}
        '201': {$ref: '#/components/responses/RefundCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '408': {$ref: '#/components/responses/RequestTimeout'}
        '500': {$ref: '#/components/responses/InternalError'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '504': {$ref: '#/components/responses/GatewayTimeout'}
  /api/integrations/medusa/v1/returns:
    post:
      tags: [ApexBooks Receiver]
      operationId: importMedusaReturnCreatedV1
      summary: Record a goods return and perform one-time restock when received.
      parameters:
        - $ref: '#/components/parameters/ApiKey'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReturnCreatedRequest'}
            examples:
              receivedReturn:
                $ref: '#/components/examples/ReturnCreatedRequestExample'
      responses:
        '200': {$ref: '#/components/responses/ReturnSuccessReplay'}
        '201': {$ref: '#/components/responses/ReturnCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '408': {$ref: '#/components/responses/RequestTimeout'}
        '500': {$ref: '#/components/responses/InternalError'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '504': {$ref: '#/components/responses/GatewayTimeout'}
  /api/integrations/medusa/v1/customers:
    post:
      tags: [ApexBooks Receiver]
      operationId: importMedusaCustomerCreatedV1
      summary: Upsert and return the canonical ApexBooks customer.
      parameters:
        - $ref: '#/components/parameters/ApiKey'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CustomerCreatedRequest'}
            examples:
              registeredCustomer:
                $ref: '#/components/examples/CustomerCreatedRequestExample'
      responses:
