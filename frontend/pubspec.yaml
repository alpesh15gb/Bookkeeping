name: apexbooks
description: "ApexBooks — Next Generation ERP accounting platform (Flutter client)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management & DI
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Networking
  dio: ^5.7.0

  # Routing
  go_router: ^14.6.2

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Internationalization & formatting
  intl: ^0.20.1

  # Fonts & icons
  google_fonts: ^6.2.1

  # File system (downloads / uploads)
  path_provider: ^2.1.5
  file_picker: ^11.0.2

  # Charts
  fl_chart: ^0.70.2

  # Utilities
  uuid: ^4.5.1
  collection: ^1.18.0
  mobile_scanner: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  custom_lint: ^0.7.6
  riverpod_lint: ^2.6.2

flutter:
  uses-material-design: true
  assets:
    - assets/

